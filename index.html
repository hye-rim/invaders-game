<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>스페이스 인베이더</title>
<style>
  /* 아이폰 사파리: 버튼을 누르다 글자가 선택되거나 길게 눌러 복사 메뉴가 뜨지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#fff;
    touch-action:none;
  }
  #stage { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:6px 8px; }
  #wrap { position:relative; background:#000; }
  #game { display:block; touch-action:none; image-rendering:pixelated; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:14px; background:rgba(0,0,0,.82); }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:46px; font-weight:900; letter-spacing:.06em; color:#8aff8a; text-shadow:0 3px 0 #1a6a1a; }
  #overlay h2 { font-size:24px; font-weight:900; }
  #overlay p { font-size:13px; color:#e6e6e6; line-height:1.6; }
  #overlay .big { font-size:18px; font-weight:800; color:#ffd23a; }
  #overlay .help { font-size:12px; color:#bdbdbd; line-height:1.7; }
  #overlay button { margin-top:6px; background:linear-gradient(180deg,#c8ffc8,#4ac84a); color:#032403; font-weight:900; font-size:17px; border:none; border-radius:999px; padding:12px 34px; box-shadow:0 4px 0 #1a7a1a; cursor:pointer; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #1a7a1a; }
  #top { position:absolute; right:3px; top:2px; display:flex; gap:6px; z-index:2; }
  #top button { position:relative; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); color:#fff; width:30px; height:30px; border-radius:8px; font-size:13px; cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-7px -4px; }
  /* 폰 조작판: 왼쪽 ◀ ▶, 오른쪽 발사 */
  #controls { display:none; width:100%; justify-content:space-between; align-items:center; padding:0 14px; }
  #movePad { display:flex; gap:10px; touch-action:none; }
  #movePad button { width:84px; height:78px; border-radius:20px; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:rgba(255,255,255,.85); font-size:30px; touch-action:none; }
  #fireBtn { width:96px; height:96px; border-radius:50%; border:3px solid rgba(255,255,255,.3); color:#fff; font-size:17px; font-weight:900; background:radial-gradient(circle at 35% 30%, #ffb09a, #c4361b); touch-action:none; }
  #controls button.on { transform:scale(.92); filter:brightness(1.3); }
  .pc { display:none; }
  @media (pointer:fine) { .pc { display:inline; } .touch { display:none; } }
  @media (pointer:coarse) { #controls { display:flex; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="top">
      <button id="muteBtn" title="소리 (M)">🔊</button>
      <button id="pauseBtn" title="일시정지 (P)">⏸</button>
    </div>
    <div id="overlay">
      <h1>스페이스<br>인베이더</h1>
      <p>줄지어 내려오는 <b>외계인 55마리</b>를 대포로 쏘아요! 👾<br>방어벽 뒤에 숨고, 바닥에 닿기 전에 모두 없애요</p>
      <div class="help">
        <span class="pc">⌨️ ← → 이동 · 스페이스 발사 · P 일시정지 · M 소리</span>
        <span class="touch">👆 왼쪽 ◀ ▶ 로 이동 · 빨간 버튼으로 발사</span>
      </div>
      <button id="startBtn">시작하기</button>
    </div>
  </div>
  <div id="controls">
    <div id="movePad"><button id="leftBtn">◀</button><button id="rightBtn">▶</button></div>
    <button id="fireBtn">발사</button>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
